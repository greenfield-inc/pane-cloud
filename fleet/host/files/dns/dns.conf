# The filtering DNS resolver for Pane Cloud machines (F3). Every guest's DNS query on port 53, to any
# server, is redirected here by the fleet's nftables table and answered on the guest's gateway address.
# It listens only on machines' taps, never on the uplink or loopback.
interface=fctap*
except-interface=lo
bind-dynamic
# No DHCP, no TFTP: guests get their address from the kernel ip= argument.
no-dhcp-interface=fctap*
# Forward to Quad9, a public resolver that also blocks known malware domains, never to the VPC's
# resolver: guests must not learn the VPC's internal names or Route 53 private zones.
no-resolv
no-hosts
server=9.9.9.9
server=149.112.112.112
domain-needed
bogus-priv
cache-size=10000
# AWS internal names (*.compute.internal, *.ec2.internal) answer NXDOMAIN without asking upstream.
local=/internal/
# Drop answers that point into private, loopback, link-local, test or shared (100.64/10) ranges, so a
# public name cannot point a guest's tools at the host's networks.
stop-dns-rebind
bogus-nxdomain=100.64.0.0/10
# Blocked domains answer NXDOMAIN.
conf-file=/etc/fleet/dns-blocklist.conf
