# Machines reach the internet through the host's NAT (F3).
net.ipv4.ip_forward = 1
# Never swap guest memory to the host's disk.
vm.swappiness = 0
# Many machines, each with its own tap, vsock and API sockets.
fs.file-max = 4194304
fs.inotify.max_user_instances = 8192
kernel.pid_max = 4194304
# Hide kernel pointers and dmesg from unprivileged users on the host.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# Root never follows a link or hard link a jailed machine planted where it shouldn't.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
