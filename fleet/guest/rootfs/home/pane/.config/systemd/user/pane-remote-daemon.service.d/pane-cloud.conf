# Agent panels inherit the daemon's environment: find the agent CLIs, and resume after a stop.
# PANE_SECRETS_DIR is the secrets volume's mount point, where Pane keeps its secrets (K1). Sign-in
# files the agent CLIs write themselves (~/.codex/auth.json, ~/.config/gh/hosts.yml) are not moved
# there yet and stay on the Session disk.
[Service]
Environment=PATH=/home/pane/.local/bin:/home/pane/.opencode/bin:/usr/local/bin:/usr/bin:/bin
Environment=PANE_RESUME_AGENTS_ON_START=1
Environment=PANE_SECRETS_DIR=/home/pane/.pane-secrets
